[project]
name = "mui"
version = "0.1.0"
description = "Terminal UI for Monday.com"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mui = "mui.app:main"
